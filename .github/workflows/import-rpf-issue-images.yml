name: Import RPF Issue Images

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Source Issue number"
        required: true
        type: number
      dry_run:
        description: "Dry run only (do not write files)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Import issue images
        env:
          RPF_READ_TOKEN: ${{ secrets.RPF_READ_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--issue "$ISSUE_NUMBER")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 tools/import_rpf_issue_images.py "${args[@]}"

      - name: Show generated files
        if: ${{ inputs.dry_run == false }}
        run: |
          git status --short
          find devlog/images -maxdepth 1 -type f -print 2>/dev/null | sort || true

      - name: Commit imported images
        if: ${{ inputs.dry_run == false }}
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devlog/images
          git commit -m "Import images for development Issue #${ISSUE_NUMBER}"
          git push
